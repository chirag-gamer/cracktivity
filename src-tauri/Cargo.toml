[package]
name = "cracktivity"
version = "0.1.0"
description = "Privacy-first desktop email client for Windows"
authors = ["cracktivity"]
edition = "2021"
rust-version = "1.90"

# Tauri expects a cdylib/staticlib for the bundler and a rlib for tests.
[lib]
name = "cracktivity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"

# Locked stack (D-006/D-007/D-009): SQLCipher-bundled rusqlite + Credential Manager
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring-core = "1"
windows-native-keyring-store = "1.1"
getrandom = "0.4"
# IMAP transport (D-009): blocking client over rustls (crate default features).
io-imap = "0.8"
io-sasl = "0.1"
url = "2"
mail-parser = "0.11.9"
secrecy = "0.10"
ureq = "3.5.1"
sha2 = "0.11.1"
base64 = "0.23.1"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
# `tauri::test` MockRuntime harness (D-018 L2); kept out of release builds
tauri = { version = "2.12", features = ["test"] }

[features]
# gui is the default binary role; mcp role dispatches in main.rs (spec §1)
default = []
