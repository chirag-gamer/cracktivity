<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cracktivity</title>
    <script>
      // Pre-paint theme (D-040): apply the persisted choice (system/light/
      // dark) before the first paint so dark-mode launches never flash
      // white. The React provider reads the same attribute it set.
      (function () {
        try {
          var v = localStorage.getItem("cracktivity.theme");
          var dark =
            v === "dark" ||
            (v !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* storage unavailable — CSS default (light) applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // E2E diagnostics: surface module/eval errors into the DOM so a
      // headless run can read them (WebView2 console is not accessible via
      // native WebDriver).
      window.addEventListener("error", function (e) {
        var d = document.createElement("pre");
        d.id = "js-error";
        d.textContent = "JS-ERROR: " + (e.message || e.type) + " @ " + (e.filename || "") + ":" + e.lineno;
        document.body.appendChild(d);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
